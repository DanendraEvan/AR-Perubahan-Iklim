<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerusakan Kulit - Simulasi 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #02050d;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 290px;
      background: rgba(2, 5, 13, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(120, 190, 255, 0.38);
      padding: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: width 0.2s ease;
    }
    #panel.minimized {
      width: 200px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h1 {
      font-size: 14px;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: #fff;
    }
    button {
      font-family: inherit;
      background: rgba(2, 5, 13, 0.6);
      color: #fff;
      border: 1px solid rgba(120, 190, 255, 0.38);
      border-radius: 0;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      text-align: left;
      display: block;
      outline: none;
    }
    button:hover, button:focus {
      border-color: #ffb347;
      color: #ffb347;
    }
    #togglePanel {
      padding: 2px 7px;
      text-align: center;
      line-height: 1;
      font-size: 14px;
      font-weight: bold;
    }
    .back-link {
      font-size: 11px;
      color: #fff;
      text-decoration: none;
      display: inline-block;
    }
    .back-link:hover, .back-link:focus {
      color: #ffb347;
    }
    #errors {
      color: #ff8080;
      font-size: 10px;
      line-height: 1.3;
    }
    #errors:empty {
      display: none;
    }
    .instructions {
      font-size: 9.5px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      border-top: 1px solid rgba(120, 190, 255, 0.2);
      padding-top: 8px;
    }
    #videoView {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: radial-gradient(circle at center, #0a182e 0%, #030814 60%, #02050d 100%);
    }
    #videoView .layer-webgl {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #videoView .layer-css3d {
      position: absolute;
      inset: 0;
    }
    .video-frame-container {
      width: 960px;
      height: 540px;
      background: #000;
      border: 0;
    }
    .video-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 600px) {
      #panel {
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 45svh;
        overflow-y: auto;
        border-left: 0;
        border-right: 0;
        border-top: 0;
      }
      #panel.minimized {
        width: 100%;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="videoView">
    <div id="videoWebGL" class="layer-webgl"></div>
    <div id="videoCSS3D" class="layer-css3d"></div>
  </div>

  <aside id="panel">
    <div class="panel-header">
      <h1>KERUSAKAN KULIT</h1>
      <button id="togglePanel" type="button" aria-label="Kecilkan menu" title="Kecilkan menu">–</button>
    </div>

    <div id="panelContent" style="display: flex; flex-direction: column; gap: 10px;">
      <a href="/ar3.html" class="back-link">← Kembali</a>

      <div id="errors"></div>

      <div class="instructions">
        Seret untuk memutar, scroll untuk zoom.
      </div>
    </div>
  </aside>

  <script type="module">
    // Video Google Drive (format embed /preview)
    const VIDEO_URL = 'https://drive.google.com/file/d/1Kyt93aK_0mB2_1jp-rk1NLp5JQ3m98SB/preview';

    const errors = document.getElementById('errors');
    const togglePanel = document.getElementById('togglePanel');
    const panel = document.getElementById('panel');
    const panelContent = document.getElementById('panelContent');

    let isMinimized = false;
    togglePanel.addEventListener('click', () => {
      isMinimized = !isMinimized;
      if (isMinimized) {
        panel.classList.add('minimized');
        panelContent.style.display = 'none';
        togglePanel.textContent = '+';
        togglePanel.setAttribute('aria-label', 'Buka menu');
        togglePanel.setAttribute('title', 'Buka menu');
      } else {
        panel.classList.remove('minimized');
        panelContent.style.display = 'flex';
        togglePanel.textContent = '–';
        togglePanel.setAttribute('aria-label', 'Kecilkan menu');
        togglePanel.setAttribute('title', 'Kecilkan menu');
      }
    });

    async function initVideo3D() {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const { CSS3DRenderer, CSS3DObject } = await import('three/addons/renderers/CSS3DRenderer.js');

      const containerGL = document.getElementById('videoWebGL');
      const containerCSS = document.getElementById('videoCSS3D');

      const sceneGL = new THREE.Scene();
      const sceneCSS = new THREE.Scene();

      const fov = 45;
      const camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 1, 5000);

      const rendererGL = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      rendererGL.setSize(window.innerWidth, window.innerHeight);
      rendererGL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      containerGL.appendChild(rendererGL.domElement);

      const rendererCSS = new CSS3DRenderer();
      rendererCSS.setSize(window.innerWidth, window.innerHeight);
      containerCSS.appendChild(rendererCSS.domElement);

      const controls = new OrbitControls(camera, rendererCSS.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.minAzimuthAngle = -0.7;
      controls.maxAzimuthAngle = 0.7;
      controls.minPolarAngle = Math.PI / 2 - 0.45;
      controls.maxPolarAngle = Math.PI / 2 + 0.45;

      const screenW = 960;
      const screenH = 540;
      const margin = 22;
      const depth = 34;

      function updateCameraDistance() {
        const totalW = screenW + margin * 2;
        const totalH = screenH + margin * 2;
        const aspect = window.innerWidth / window.innerHeight;
        const distV = (totalH / 2) / Math.tan((fov * Math.PI / 180) / 2);
        const distH = (totalW / 2) / Math.tan(((fov * Math.PI / 180) / 2) * aspect);
        const fitDist = Math.max(distV, distH) * 1.05;
        camera.position.set(0, 0, fitDist);
        controls.minDistance = fitDist * 0.6;
        controls.maxDistance = fitDist * 2.0;
        controls.target.set(0, 0, 0);
        controls.update();
      }
      updateCameraDistance();

      const boxW = screenW + margin * 2;
      const boxH = screenH + margin * 2;
      const frameGeo = new THREE.BoxGeometry(boxW, boxH, depth);
      const faceMaterials = [
        new THREE.MeshBasicMaterial({ color: 0x0d1f38 }),
        new THREE.MeshBasicMaterial({ color: 0x091629 }),
        new THREE.MeshBasicMaterial({ color: 0x142b4d }),
        new THREE.MeshBasicMaterial({ color: 0x081324 }),
        new THREE.MeshBasicMaterial({ color: 0x040a14 }),
        new THREE.MeshBasicMaterial({ color: 0x102440 })
      ];
      const frameMesh = new THREE.Mesh(frameGeo, faceMaterials);
      frameMesh.position.z = -depth / 2;

      const edgesGeo = new THREE.EdgesGeometry(frameGeo);
      const edgesLine = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0xffb347 }));
      frameMesh.add(edgesLine);

      const floatGroup = new THREE.Group();
      floatGroup.add(frameMesh);
      sceneGL.add(floatGroup);

      const starGeo = new THREE.BufferGeometry();
      const starCount = 900;
      const starPos = new Float32Array(starCount * 3);
      const starCol = new Float32Array(starCount * 3);
      const colWhite = new THREE.Color(0xffffff);
      const colAmber = new THREE.Color(0xffb347);

      for (let i = 0; i < starCount; i++) {
        starPos[i * 3] = (Math.random() - 0.5) * 3200;
        starPos[i * 3 + 1] = (Math.random() - 0.5) * 2200;
        starPos[i * 3 + 2] = (Math.random() - 0.5) * 2200 - 300;
        const isAmber = Math.random() < 0.12;
        const c = isAmber ? colAmber : colWhite;
        starCol[i * 3] = c.r;
        starCol[i * 3 + 1] = c.g;
        starCol[i * 3 + 2] = c.b;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
      const starMat = new THREE.PointsMaterial({ size: 3, vertexColors: true, transparent: true, opacity: 0.8 });
      const starPoints = new THREE.Points(starGeo, starMat);
      sceneGL.add(starPoints);

      const div = document.createElement('div');
      div.className = 'video-frame-container';
      const videoIframe = document.createElement('iframe');
      videoIframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      videoIframe.allowFullscreen = true;
      videoIframe.src = VIDEO_URL;
      div.appendChild(videoIframe);

      const cssObj = new CSS3DObject(div);
      cssObj.position.set(0, 0, 1);

      const cssFloatGroup = new THREE.Group();
      cssFloatGroup.add(cssObj);
      sceneCSS.add(cssFloatGroup);

      const startTime = performance.now();

      function render() {
        requestAnimationFrame(render);
        const elapsed = (performance.now() - startTime) * 0.001;
        const floatY = Math.sin(elapsed * 0.9) * 14;
        floatGroup.position.y = floatY;
        cssFloatGroup.position.y = floatY;
        starPoints.rotation.y = elapsed * 0.02;
        starPoints.rotation.x = elapsed * 0.01;
        controls.update();
        rendererGL.render(sceneGL, camera);
        rendererCSS.render(sceneCSS, camera);
      }
      render();

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        rendererGL.setSize(w, h);
        rendererCSS.setSize(w, h);
        updateCameraDistance();
      });
    }

    initVideo3D().catch((err) => {
      console.error(err);
      errors.textContent = 'Mode video gagal: ' + err.message;
    });
  </script>
</body>
</html>
