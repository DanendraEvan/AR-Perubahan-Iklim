<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kekeringan - Simulasi 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #02050d;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #app {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
    .lbl {
      color: #fff;
      background: rgba(2, 5, 13, 0.75);
      border: 1px solid rgba(120, 190, 255, 0.38);
      padding: 4px 8px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }
    .lbl small {
      display: block;
      color: #ffb347;
      font-size: 9px;
    }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 290px;
      background: rgba(2, 5, 13, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(120, 190, 255, 0.38);
      padding: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: width 0.2s ease;
    }
    #panel.minimized {
      width: 200px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h1 {
      font-size: 14px;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: #fff;
    }
    button, .btn {
      font-family: inherit;
      background: rgba(2, 5, 13, 0.6);
      color: #fff;
      border: 1px solid rgba(120, 190, 255, 0.38);
      border-radius: 0;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      display: block;
      outline: none;
    }
    button:hover, button:focus, .btn:hover, .btn:focus {
      border-color: #ffb347;
      color: #ffb347;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(120, 190, 255, 0.2);
    }
    #togglePanel {
      padding: 2px 7px;
      text-align: center;
      line-height: 1;
      font-size: 14px;
      font-weight: bold;
    }
    .back-link {
      font-size: 11px;
      color: #fff;
      text-decoration: none;
      display: inline-block;
    }
    .back-link:hover, .back-link:focus {
      color: #ffb347;
    }
    .subtitle {
      font-size: 11px;
      color: #ffb347;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    #tabs {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #tabs button.on {
      border-color: #ffb347;
      background: rgba(255, 179, 71, 0.15);
      color: #ffb347;
      font-weight: 500;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 2px;
    }
    .checkbox-wrap input[type="checkbox"] {
      appearance: none;
      width: 13px;
      height: 13px;
      border: 1px solid rgba(120, 190, 255, 0.38);
      background: transparent;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
    }
    .checkbox-wrap input[type="checkbox"]:checked {
      border-color: #ffb347;
      background: #ffb347;
    }
    .checkbox-wrap input[type="checkbox"]:hover {
      border-color: #ffb347;
    }
    #vidBtn {
      text-align: center;
      font-weight: 500;
      margin-top: 4px;
    }
    #errors {
      color: #ff8080;
      font-size: 10px;
      line-height: 1.3;
    }
    #errors:empty {
      display: none;
    }
    .instructions {
      font-size: 9.5px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      border-top: 1px solid rgba(120, 190, 255, 0.2);
      padding-top: 8px;
    }
    #info {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - 32px);
      max-width: 680px;
      max-height: 38svh;
      overflow-y: auto;
      background: rgba(2, 5, 13, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(120, 190, 255, 0.38);
      padding: 16px 20px;
      z-index: 10;
      line-height: 1.6;
    }
    #info[hidden] {
      display: none;
    }
    .stage-card {
      margin-bottom: 14px;
    }
    .stage-card:last-child {
      margin-bottom: 0;
    }
    .stage-card h3 {
      font-size: 13px;
      color: #ffb347;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .stage-card p {
      font-size: 11px;
      color: #fff;
    }
    .stage-sep {
      border: 0;
      height: 1px;
      background: rgba(120, 190, 255, 0.25);
      margin: 12px 0;
    }
    #videoView {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: radial-gradient(circle at center, #0a182e 0%, #030814 60%, #02050d 100%);
    }
    #videoView[hidden] {
      display: none;
    }
    #videoView .layer-webgl {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #videoView .layer-css3d {
      position: absolute;
      inset: 0;
    }
    .video-frame-container {
      width: 960px;
      height: 540px;
      background: #000;
      border: 0;
    }
    .video-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 600px) {
      #panel {
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 45svh;
        overflow-y: auto;
        border-left: 0;
        border-right: 0;
        border-top: 0;
      }
      #panel.minimized {
        width: 100%;
      }
      #info {
        bottom: 12px;
        max-height: 34svh;
        padding: 12px 14px;
      }
      .stage-card h3 {
        font-size: 12px;
      }
      .stage-card p {
        font-size: 10px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
  </div>

  <div id="videoView" hidden>
    <div id="videoWebGL" class="layer-webgl"></div>
    <div id="videoCSS3D" class="layer-css3d"></div>
  </div>

  <aside id="panel">
    <div class="panel-header">
      <h1>KEKERINGAN</h1>
      <button id="togglePanel" type="button" aria-label="Kecilkan menu" title="Kecilkan menu">–</button>
    </div>

    <div id="panelContent" style="display: flex; flex-direction: column; gap: 10px;">
      <a href="/ar3.html" class="back-link">← Kembali</a>

      <div class="subtitle">Tahap</div>
      <div id="tabs"></div>

      <label class="checkbox-wrap">
        <input type="checkbox" id="all">
        <span>Tampilkan semua tahap</span>
      </label>

      <div hidden>
        <button id="exportAll">Ekspor GLB (Semua)</button>
        <button id="exportEach">Ekspor GLB (Tiap Tahap)</button>
        <button id="b1"></button>
        <button id="b2"></button>
        <button id="b3"></button>
        <button id="e1"></button>
        <button id="e2"></button>
        <button id="e3"></button>
        <button id="exEach"></button>
        <div id="msg"></div>
        <ul id="list"></ul>
        <ul id="stats"></ul>
        <div id="total"></div>
      </div>

      <div id="errors"></div>

      <div class="instructions">
        Tombol 1–N di keyboard untuk ganti tahap. Seret untuk memutar, scroll untuk zoom.
      </div>
    </div>

    <button id="vidBtn" type="button">Ubah ke video</button>
  </aside>

  <section id="info">
    <div id="infoBody"></div>
  </section>

  <script type="module" src="/model/kekeringan.js"></script>

  <script type="module">
    const STAGE_DETAILS = [
      {
        title: "Tahap 1 · Subur & Air Melimpah",
        desc: "Kondisi lingkungan normal dengan cadangan air tanah dan danau yang melimpah, vegetasi tumbuh subur dengan kanopi hijau pekat, serta suhu udara seimbang tanpa adanya anomali cuaca ekstrem."
      },
      {
        title: "Tahap 2 · Suhu Naik, Air Menyusut, Tanaman Layu",
        desc: "Curah hujan menurun drastis disertai peningkatan suhu udara berkepanjangan yang mempercepat laju evaporasi air danau, memicu pembentukan retakan tanah awal, serta menyebabkan tanaman mulai layu dan menguning."
      },
      {
        title: "Tahap 3 · Air Hilang, Tanaman Kering",
        desc: "Kekeringan parah dengan habisnya seluruh badan air permukaan, tanah merekah dalam akibat pengeringan ekstrem, dan seluruh vegetasi meranggas tanpa daun hingga mati terbakar panas."
      }
    ];

    const VIDEO_ID = 'GANTI_DENGAN_ID_VIDEO';

    const info = document.getElementById('info');
    const infoBody = document.getElementById('infoBody');
    const tabs = document.getElementById('tabs');
    const allCheckbox = document.getElementById('all');
    const togglePanel = document.getElementById('togglePanel');
    const panel = document.getElementById('panel');
    const panelContent = document.getElementById('panelContent');
    const vidBtn = document.getElementById('vidBtn');
    const videoView = document.getElementById('videoView');
    const errors = document.getElementById('errors');

    function renderStageInfo(activeIndex) {
      if (allCheckbox.checked) {
        infoBody.innerHTML = STAGE_DETAILS.map((s, idx) => `
          <div class="stage-card">
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
          </div>
          ${idx < STAGE_DETAILS.length - 1 ? '<hr class="stage-sep">' : ''}
        `).join('');
      } else if (activeIndex >= 0 && activeIndex < STAGE_DETAILS.length) {
        const s = STAGE_DETAILS[activeIndex];
        infoBody.innerHTML = `
          <div class="stage-card">
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
          </div>
        `;
      }
    }

    function checkActiveTab() {
      const children = Array.from(tabs.children);
      const activeIdx = children.findIndex(btn => btn.classList.contains('on'));
      renderStageInfo(activeIdx);
    }

    const observer = new MutationObserver(() => {
      checkActiveTab();
    });
    observer.observe(tabs, { attributes: true, subtree: true, attributeFilter: ['class'] });

    allCheckbox.addEventListener('change', () => {
      checkActiveTab();
    });

    let isMinimized = false;
    togglePanel.addEventListener('click', () => {
      isMinimized = !isMinimized;
      if (isMinimized) {
        panel.classList.add('minimized');
        panelContent.style.display = 'none';
        togglePanel.textContent = '+';
        togglePanel.setAttribute('aria-label', 'Buka menu');
        togglePanel.setAttribute('title', 'Buka menu');
      } else {
        panel.classList.remove('minimized');
        panelContent.style.display = 'flex';
        togglePanel.textContent = '–';
        togglePanel.setAttribute('aria-label', 'Kecilkan menu');
        togglePanel.setAttribute('title', 'Kecilkan menu');
      }
    });

    let isVideoMode = false;
    let video3DInitialized = false;
    let videoIframe = null;
    let startVideoLoop = null;
    let stopVideoLoop = null;
    let resizeVideo3D = null;

    vidBtn.addEventListener('click', async () => {
      if (!isVideoMode) {
        try {
          if (!video3DInitialized) {
            await initVideo3D();
            video3DInitialized = true;
          }
          videoView.hidden = false;
          info.hidden = true;
          vidBtn.textContent = 'Ubah ke 3D model';
          isVideoMode = true;
          if (videoIframe) {
            videoIframe.src = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&rel=0`;
          }
          if (startVideoLoop) startVideoLoop();
        } catch (err) {
          console.error(err);
          errors.textContent = 'Mode video gagal: ' + err.message;
        }
      } else {
        videoView.hidden = true;
        info.hidden = false;
        vidBtn.textContent = 'Ubah ke video';
        isVideoMode = false;
        if (videoIframe) {
          videoIframe.src = 'about:blank';
        }
        if (stopVideoLoop) stopVideoLoop();
      }
    });

    async function initVideo3D() {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const { CSS3DRenderer, CSS3DObject } = await import('three/addons/renderers/CSS3DRenderer.js');

      const containerGL = document.getElementById('videoWebGL');
      const containerCSS = document.getElementById('videoCSS3D');

      const sceneGL = new THREE.Scene();
      const sceneCSS = new THREE.Scene();

      const fov = 45;
      const camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 1, 5000);

      const rendererGL = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      rendererGL.setSize(window.innerWidth, window.innerHeight);
      rendererGL.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      containerGL.appendChild(rendererGL.domElement);

      const rendererCSS = new CSS3DRenderer();
      rendererCSS.setSize(window.innerWidth, window.innerHeight);
      containerCSS.appendChild(rendererCSS.domElement);

      const controls = new OrbitControls(camera, rendererCSS.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.minAzimuthAngle = -0.7;
      controls.maxAzimuthAngle = 0.7;
      controls.minPolarAngle = Math.PI / 2 - 0.45;
      controls.maxPolarAngle = Math.PI / 2 + 0.45;

      const screenW = 960;
      const screenH = 540;
      const margin = 22;
      const depth = 34;

      function updateCameraDistance() {
        const totalW = screenW + margin * 2;
        const totalH = screenH + margin * 2;
        const aspect = window.innerWidth / window.innerHeight;
        const distV = (totalH / 2) / Math.tan((fov * Math.PI / 180) / 2);
        const distH = (totalW / 2) / Math.tan(((fov * Math.PI / 180) / 2) * aspect);
        const fitDist = Math.max(distV, distH) * 1.05;
        camera.position.set(0, 0, fitDist);
        controls.minDistance = fitDist * 0.6;
        controls.maxDistance = fitDist * 2.0;
        controls.target.set(0, 0, 0);
        controls.update();
      }
      updateCameraDistance();

      const boxW = screenW + margin * 2;
      const boxH = screenH + margin * 2;
      const frameGeo = new THREE.BoxGeometry(boxW, boxH, depth);
      const faceMaterials = [
        new THREE.MeshBasicMaterial({ color: 0x0d1f38 }),
        new THREE.MeshBasicMaterial({ color: 0x091629 }),
        new THREE.MeshBasicMaterial({ color: 0x142b4d }),
        new THREE.MeshBasicMaterial({ color: 0x081324 }),
        new THREE.MeshBasicMaterial({ color: 0x040a14 }),
        new THREE.MeshBasicMaterial({ color: 0x102440 })
      ];
      const frameMesh = new THREE.Mesh(frameGeo, faceMaterials);
      frameMesh.position.z = -depth / 2;

      const edgesGeo = new THREE.EdgesGeometry(frameGeo);
      const edgesLine = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0xffb347 }));
      frameMesh.add(edgesLine);

      const floatGroup = new THREE.Group();
      floatGroup.add(frameMesh);
      sceneGL.add(floatGroup);

      const starGeo = new THREE.BufferGeometry();
      const starCount = 900;
      const starPos = new Float32Array(starCount * 3);
      const starCol = new Float32Array(starCount * 3);
      const colWhite = new THREE.Color(0xffffff);
      const colAmber = new THREE.Color(0xffb347);

      for (let i = 0; i < starCount; i++) {
        starPos[i * 3] = (Math.random() - 0.5) * 3200;
        starPos[i * 3 + 1] = (Math.random() - 0.5) * 2200;
        starPos[i * 3 + 2] = (Math.random() - 0.5) * 2200 - 300;
        const isAmber = Math.random() < 0.12;
        const c = isAmber ? colAmber : colWhite;
        starCol[i * 3] = c.r;
        starCol[i * 3 + 1] = c.g;
        starCol[i * 3 + 2] = c.b;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
      const starMat = new THREE.PointsMaterial({ size: 3, vertexColors: true, transparent: true, opacity: 0.8 });
      const starPoints = new THREE.Points(starGeo, starMat);
      sceneGL.add(starPoints);

      const div = document.createElement('div');
      div.className = 'video-frame-container';
      videoIframe = document.createElement('iframe');
      videoIframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      videoIframe.allowFullscreen = true;
      div.appendChild(videoIframe);

      const cssObj = new CSS3DObject(div);
      cssObj.position.set(0, 0, 1);

      const cssFloatGroup = new THREE.Group();
      cssFloatGroup.add(cssObj);
      sceneCSS.add(cssFloatGroup);

      let animId = null;
      let startTime = performance.now();

      function render() {
        animId = requestAnimationFrame(render);
        const elapsed = (performance.now() - startTime) * 0.001;
        const floatY = Math.sin(elapsed * 0.9) * 14;
        floatGroup.position.y = floatY;
        cssFloatGroup.position.y = floatY;
        starPoints.rotation.y = elapsed * 0.02;
        starPoints.rotation.x = elapsed * 0.01;
        controls.update();
        rendererGL.render(sceneGL, camera);
        rendererCSS.render(sceneCSS, camera);
      }

      startVideoLoop = () => {
        if (!animId) {
          startTime = performance.now();
          render();
        }
      };

      stopVideoLoop = () => {
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
      };

      resizeVideo3D = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        rendererGL.setSize(w, h);
        rendererCSS.setSize(w, h);
        updateCameraDistance();
      };
      window.addEventListener('resize', resizeVideo3D);
    }
  </script>
</body>
</html>
